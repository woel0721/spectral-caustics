name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  style:
    name: style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Retain the read-only credential for fetching missing comparison commits.
          persist-credentials: true
      - name: Check whitespace in the event's commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          ensure_commit() {
            if ! git cat-file -e "${1}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$1"
            fi
            git cat-file -e "${1}^{commit}"
          }

          base="$BASE_SHA"
          head="$HEAD_SHA"
          ensure_commit "$head"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ensure_commit "$base"
            base="$(git merge-base "$base" "$head")"
          elif [[ "$base" =~ ^0+$ ]]; then
            # An initial push has no previous commit: check the entire new tree.
            base="$(git hash-object -w -t tree /dev/null)"
          else
            ensure_commit "$base"
          fi

          echo "Checking whitespace from $base to $head"
          git diff --check "$base" "$head" --
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --check

  rust-default:
    name: rust-default
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Test default configuration
        run: cargo test --locked
      - name: Check default configuration with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-diagnostics:
    name: rust-diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Test diagnostics configuration
        run: cargo test --locked --all-targets --features diagnostics
      - name: Check diagnostics configuration with Clippy
        run: cargo clippy --locked --all-targets --features diagnostics -- -D warnings
