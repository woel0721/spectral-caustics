[package]
name = "spectral-caustics"
version = "0.1.0"
edition = "2024"

[features]
default = []
diagnostics = []

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "hdr"] }
nalgebra = "0.35.0"
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[[example]]
name = "spectral_wavelength_projection"
required-features = ["diagnostics"]

[[example]]
name = "spectral_fog_compare"
required-features = ["diagnostics"]
